<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 · 一件代发实战手册</title>
<style>
  :root{--ink:#1c1917;--muted:#78716c;--accent:#c2410c;--line:#e7e2da}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf8f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  .box{max-width:440px;text-align:center}
  .code{font-size:72px;font-weight:800;letter-spacing:-.04em;color:var(--accent);line-height:1;margin-bottom:10px}
  h1{font-size:22px;margin:0 0 10px}
  p{color:var(--muted);font-size:14px;line-height:1.8;margin:0 0 24px}
  a{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;padding:10px 22px;border-radius:99px;font-size:14px;font-weight:600}
  a:hover{opacity:.9}
</style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已经失效，或者地址输错了。</p>
    <a href="/dropship-playbook/">回到手册首页</a>
  </div>
</body>
</html>
